; E-Raum-Controller (Olimex ESP32-EVB, Ethernet, MQTT, SD, 2 Relais)
; Pinbelegung: docs/pinbelegung.md
[env:e-raum]
platform = espressif32
; Olimex-Board. Falls PlatformIO dieses Board nicht kennt: "esp32dev" nutzen,
; die Ethernet-Pins kommen dann aus den Standardwerten des ESP32-Ethernet (siehe config.h).
board = esp32-evb
framework = arduino
monitor_speed = 115200
; Port am PC anpassen (Board per USB)
upload_port = COM4
monitor_port = COM4
lib_deps =
    knolleary/PubSubClient @ 2.8
    bblanchon/ArduinoJson @ 7.2.0
